name: 插件问题
description: 报告安装、提取、统计或归档问题（勿上传真实课程和凭据）
body:
  - type: markdown
    attributes:
      value: 请使用虚构文件名和正文。凭据泄露等安全问题先读 SECURITY.md，不要公开敏感复现。
  - type: input
    id: version
    attributes:
      label: 插件 / 浏览器 / 系统版本
      placeholder: 4.2.3 / Edge 版本号 / Windows 11
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤与预期结果
      description: 区分网页文稿、字幕和下载阶段；说明是不是更新后首次运行。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果及脱敏错误提示
      description: 已缓存 / 尚未取得数量、错误分类。不要提供 Cookie、Token、真实路径、正文或浏览器用户目录。
    validations:
      required: true
